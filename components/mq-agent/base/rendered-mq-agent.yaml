apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ibm-mq-agent-ibm-mq-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "ibm-mq-agent"
      app.kubernetes.io/instance: "ibm-mq-agent"
      app.kubernetes.io/managed-by: "Helm"
      app.kubernetes.io/component: integration
  ingress:
    # Allow inbound traffic from pods in the same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8001
    # Allow traffic from OpenShift ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8001
---
