kind: MessagingServer
apiVersion: integration.ibm.com/v1beta1
metadata:
  name: sample-messagingserver
spec:
  queueManager:
    name: MSGSERVERQM
    storage:
      defaultClass: PATCHED_BY_KUSTOMZIE
    availability:
      type: NativeHA
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 300m
        memory: 1Gi
